name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Pack
        run: |
          PACK_VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack src/Xabe.FFmpeg -c Release -p:GenerateDocumentationFile=true -p:MinVerSkip=true -p:Version="${PACK_VERSION}" -p:PackageVersion="${PACK_VERSION}"
          dotnet pack src/Xabe.FFmpeg.Downloader -c Release -p:GenerateDocumentationFile=true -p:MinVerSkip=true -p:Version="${PACK_VERSION}" -p:PackageVersion="${PACK_VERSION}"
          mkdir -p dist
          cp src/Xabe.FFmpeg/bin/Release/*.nupkg dist/
          cp src/Xabe.FFmpeg.Downloader/bin/Release/*.nupkg dist/

      - name: Notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV="$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD^ 2>/dev/null || true)"
          {
            echo "## ${TAG}"
            echo ""
            if [ -n "${PREV}" ]; then
              git log --pretty='- %s' "${PREV}..${TAG}"
            else
              git log --pretty='- %s' -30
            fi
          } > notes.md

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --target "${GITHUB_SHA}" --notes-file notes.md dist/*.nupkg

      - name: Publish
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for f in dist/*.nupkg; do
            dotnet nuget push "$f" --api-key "${NUGET_API_KEY}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
